<body>
<div class="espn-nav">
  <div class="espn-logo"><img src="espn_full_logo.png" alt="ESPN"></div>

<div class="score-ticker" id="score-ticker"></div>

<script src="js/app-model.js"></script>
<script>
  async function init() {
    const data = await AppModel.load();
    if (!data) return;
    AppModel.renderTicker(document.getElementById('score-ticker'), data.tickerGames, AppModel.getRankLookup(data.dynasty.week));
    AppModel.renderPageNews(document.getElementById('page-news-list'), 'recruiting');
  }
  init();
</script>

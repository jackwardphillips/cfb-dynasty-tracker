<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Football Rankings - ESPN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/espn.css">
</head>
<body>
<div class="espn-nav">
  <div class="espn-logo"><img src="espn_full_logo.png" alt="ESPN"></div>
  <div class="espn-nav-links"><a href="#">Scores</a><a href="#">Watch</a><a href="#">NFL</a><a href="#">CFB</a><a href="#">NBA</a><a href="#">More</a></div>
</div>
<div class="espn-subnav">
  <a href="espn_cfb27_dynasty.html">Home</a><a href="scores.html">Scores</a><a href="schedule.html">Schedule</a><a href="standings.html">Standings</a><a href="rankings.html" class="active">Rankings</a><a href="stats.html">Stats</a><a href="recruiting.html">Recruiting</a><a href="playoff.html">Playoff</a>
</div>
<div class="score-ticker" id="score-ticker"></div>
<div class="espn-body">
  <div class="main-col">
    <div class="page-header">
      <h1 class="page-title">AP Top 25</h1>
      <p class="page-subtitle">Week 0 Dynasty Rankings</p>
    </div>
    <div class="sidebar-card" style="padding: 0; overflow: hidden; border-radius: 10px;">
      <table class="data-table">
        <thead><tr><th>Rank</th><th>Team</th><th>Record</th></tr></thead>
        <tbody id="data-table-body"></tbody>
      </table>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-card">
      <div class="section-label">Recent Rankings News</div>
      <div id="page-news-list"></div>
    </div>
  </div>
</div>
<div class="espn-footer"><p>&copy; 2027 ESPN Inc. All rights reserved.</p></div>
<script src="js/app-model.js"></script>
<script>
  async function init() {
    const data = await AppModel.load();
    if (!data) return;
    AppModel.renderTicker(document.getElementById('score-ticker'), data.tickerGames);
    AppModel.renderPageNews(document.getElementById('page-news-list'), 'rankings');
    
    const rankings = data.weeklyRankings[0].rankings;
    document.getElementById('data-table-body').innerHTML = rankings.map(team => `
      <tr>
        <td>${team.rank}</td>
        <td style="font-weight:600;">${team.team}</td>
        <td>${team.record}</td>
      </tr>
    `).join('');
  }
  init();
</script>
</body>
</html>

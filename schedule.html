<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Football Schedule - ESPN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/espn.css">
</head>
<body>
<div class="espn-nav">
  <div class="espn-logo"><img src="espn_full_logo.png" alt="ESPN"></div>
  <div class="espn-nav-links"><a href="#">Scores</a><a href="#">Watch</a><a href="#">NFL</a><a href="#">CFB</a><a href="#">NBA</a><a href="#">More</a></div>
</div>
<div class="espn-subnav">
  <a href="espn_cfb27_dynasty.html">Home</a>
  <a href="scores.html">Scores</a>
  <a href="schedule.html" class="active">Schedule</a>
  <a href="standings.html">Standings</a>
  <a href="rankings.html">Rankings</a>
  <a href="stats.html">Stats</a>
  <a href="recruiting.html">Recruiting</a>
  <a href="playoff.html">Playoff</a>
</div>
<div class="score-ticker" id="score-ticker"></div>
<div class="espn-body">
  <div class="main-col">
    <div class="page-header">
      <h1 class="page-title">2027 Schedule</h1>
      <p class="page-subtitle">Complete week-by-week dynasty schedule</p>
    </div>
    <div class="sidebar-card" style="padding: 0; overflow: hidden; border-radius: 10px;">
      <table class="data-table">
        <thead><tr><th>Week</th><th>Matchup</th><th>Status/TV</th></tr></thead>
        <tbody id="data-table-body"></tbody>
      </table>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-card">
      <div class="section-label">Recent Schedule News</div>
      <div id="page-news-list"></div>
    </div>
  </div>
</div>
<div class="espn-footer"><p>&copy; 2027 ESPN Inc. All rights reserved.</p></div>
<script src="js/app-model.js"></script>
<script>
  async function init() {
    const data = await AppModel.load();
    if (!data) return;
    AppModel.renderTicker(document.getElementById('score-ticker'), data.tickerGames);
    AppModel.renderPageNews(document.getElementById('page-news-list'), 'schedule');
    
    document.getElementById('data-table-body').innerHTML = data.tickerGames.map(game => `
      <tr>
        <td>Week ${game.week}</td>
        <td>${game.away.team} at ${game.home.team}</td>
        <td>${game.status}</td>
      </tr>
    `).join('');
  }
  init();
</script>
</body>
</html>
